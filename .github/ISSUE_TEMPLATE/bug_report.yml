name: Bug report
description: Report a problem with Time Shield
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much as you can. This is a
        local-first extension, so your data never leaves your device — details about
        what you saw matter a lot.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in the Options page and on the Chrome Web Store.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser + version
      description: e.g. Chrome 126 on Windows 11 / macOS 14 / Ubuntu 24.04
      placeholder: Chrome 126, Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? Which site(s), what limit, pause/lock used?
      placeholder: |
        1. Open popup
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Screenshots or console output from `chrome://extensions` → "Service worker" help a lot.